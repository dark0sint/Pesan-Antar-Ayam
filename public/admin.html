<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dapur | Admin Pesan Antar Ayam</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
 body{background:#F4EFE8}
 .wrap{max-width:1300px;margin:0 auto;padding:16px}
 .login{max-width:360px;margin:12vh auto}
 .tabs{display:flex;gap:8px;margin:12px 0}
 .board{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:start}
 .colh{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font:800 1.05rem var(--display)}
 .colh span{background:#fff;border-radius:999px;padding:2px 10px;font-size:.85rem}
 .ord{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
 .ord.new{border-color:var(--red);box-shadow:0 0 0 3px rgba(179,18,31,.15)}
 .ord h3{font-size:1rem;display:flex;justify-content:space-between;gap:8px}
 .ord ul{margin:8px 0;padding-left:18px}
 .ord li{margin:4px 0}
 .tag{display:inline-block;background:#E4F5EA;color:var(--ok);font-size:.75rem;font-weight:700;border-radius:6px;padding:1px 7px}
 .tag.warn{background:#FFF6DC;color:#6B4A00}
 .tag.red{background:#FDECEC;color:var(--red-d)}
 .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
 .stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:12px 0}
 .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
 .stat b{display:block;font:800 1.6rem var(--display)}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
 th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
 td input[type=number]{width:110px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px}
 .grid4{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" role="status"></div>
<script src="/admin.js"></script>
</body>
</html>
