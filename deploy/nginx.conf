# /etc/nginx/sites-available/pesan-ayam  (ganti ayam.contoh.com)
# Lalu: sudo certbot --nginx -d ayam.contoh.com   (HTTPS wajib agar tombol "Gunakan lokasi saya" jalan di HP)
server {
    listen 80;
    server_name ayam.contoh.com;
    client_max_body_size 200k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
